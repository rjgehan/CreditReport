name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run tests
        run: ./mvnw -B verify
      - name: Syntax-check the front end
        run: for f in $(find src/main/resources/static -name '*.js'); do node --check "$f" || exit 1; done
