# Finance on CasaOS, reachable over Tailscale.
#
# The container listens on 127.0.0.1 only, so nothing on your LAN can reach it.
# Tailscale on the server publishes it to your tailnet with a real HTTPS
# certificate:
#
#   https://<server-name>.<your-tailnet>.ts.net
#
# The Cloudflare Tunnel sidecar (like the stocks app's) is what Claude connects
# through. On that hostname only Claude's parts answer: /mcp, its sign-in and the
# consent page. The app and your balances stay on Tailscale.
#
# Full walkthrough: DEPLOY.md in the repository. In short, before importing:
#
#   sudo mkdir -p /DATA/AppData/finance
#   sudo chown -R 10001:10001 /DATA/AppData/finance
#
# Then: CasaOS -> + -> Custom Install -> Import -> paste -> fill in CHANGE ME,
# and on the server:
#
#   sudo tailscale serve --bg --https=443 http://127.0.0.1:8095

name: finance

services:
  finance:
    image: ghcr.io/rjgehan/creditreport:latest
    container_name: finance
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    ports:
      # Loopback only: Tailscale serve is the one way in.
      - target: 8080
        host_ip: 127.0.0.1
        published: "8095"
        protocol: tcp
    environment:
      # CHANGE ME. Your sign-in. You enter it once per device; it lasts a year.
      - APP_USERNAME=me
      - APP_PASSWORD=CHANGE_ME
      # CHANGE ME. Encrypts bank tokens at rest. Generate on the server with:
      #   openssl rand -base64 32
      # Keep a copy in your password manager; without it the stored bank
      # connections can't be read and you'd have to reconnect them.
      - APP_ENCRYPTION_KEY=CHANGE_ME
      # Tailscale serve terminates HTTPS, so cookies can be HTTPS-only.
      - SESSION_COOKIE_SECURE=true
      - APP_DEMO_DATA=false
      - APP_DATA_DIR=/data
      - TZ=America/New_York
      # Optional: the tunnel hostname, so the Claude screen shows the address to add.
      # - APP_PUBLIC_URL=https://finance.<your-domain>
    volumes:
      - type: bind
        source: /DATA/AppData/finance
        target: /data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    x-casaos:
      envs:
        - container: APP_PASSWORD
          description:
            en_us: Your sign-in password.
        - container: APP_ENCRYPTION_KEY
          description:
            en_us: "openssl rand -base64 32. Encrypts bank tokens. Back it up."
      ports:
        - container: "8080"
          description:
            en_us: Loopback only. Open it at https://<server>.<tailnet>.ts.net after running tailscale serve.
      volumes:
        - container: /data
          description:
            en_us: finance.db and the logo cache. Must be owned by UID 10001. Back it up.

  cloudflared: # Cloudflare Tunnel sidecar (one tunnel per app). Public hostname -> HTTP finance:8080
    image: cloudflare/cloudflared:latest
    container_name: finance-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # CHANGE ME. Zero Trust -> Networks -> Tunnels -> the finance tunnel's token.
      - TUNNEL_TOKEN=CHANGE_ME
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels: # Watchtower: keep the tunnel client current
      com.centurylinklabs.watchtower.enable: "true"
    x-casaos:
      envs:
        - container: TUNNEL_TOKEN
          description:
            en_us: Token of this app's Cloudflare Tunnel. Route finance.<domain> to HTTP finance:8080.

x-casaos:
  architectures:
    - amd64
    - arm64
  main: finance
  author: rjgehan
  developer: rjgehan
  category: Finance
  title:
    en_us: Finance
  tagline:
    en_us: Where the money goes, every month.
  description:
    en_us: >-
      Self-hosted personal finance: bank and card syncing through SimpleFIN,
      investments priced from holdings, a cash-flow Sankey, spending targets,
      savings goals and a monthly score. Reachable over Tailscale; Claude
      connects through a Cloudflare Tunnel and never sees balances.
  icon: https://raw.githubusercontent.com/rjgehan/CreditReport/main/src/main/resources/static/icons/apple-touch-icon.png
  scheme: https
  index: /
  port_map: "8095"
  store_app_id: finance
