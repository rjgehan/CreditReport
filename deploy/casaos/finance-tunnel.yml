# Optional: lets Claude (claude.ai, the Claude apps) reach Finance's MCP server.
#
# Only a few paths are public, set by the tunnel's route in Cloudflare (DEPLOY.md,
# section 5): /mcp and Claude's token and registration endpoints. Each of them is
# useless without a token you approved on the consent screen, and that screen,
# the sign-in and the rest of the app stay on Tailscale.
#
# CasaOS -> + -> Custom Install -> Import -> paste -> put the tunnel's token in
# TUNNEL_TOKEN.

name: finance-tunnel

services:
  finance-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: finance-tunnel
    restart: unless-stopped
    # Host networking so it can reach the app on 127.0.0.1:8095, where it listens.
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      # CHANGE ME. Zero Trust -> Networks -> Tunnels -> your "finance" tunnel.
      - TUNNEL_TOKEN=CHANGE_ME
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    x-casaos:
      envs:
        - container: TUNNEL_TOKEN
          description:
            en_us: Token of the finance Cloudflare Tunnel. Route finance.<domain> (with the path rule in DEPLOY.md) to HTTP 127.0.0.1:8095.

x-casaos:
  architectures:
    - amd64
    - arm64
