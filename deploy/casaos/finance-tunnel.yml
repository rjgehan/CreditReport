# The Cloudflare Tunnel Claude connects to Finance through, as its own CasaOS app
# so the finance app itself doesn't change. On the tunnel's hostname only Claude's
# parts answer (/mcp, its sign-in and the consent page); the app and your balances
# stay on Tailscale.
#
# CasaOS -> + -> Custom Install -> Import -> paste -> put the tunnel's token in
# TUNNEL_TOKEN. In Cloudflare, route the hostname to HTTP localhost:8095.

name: finance-tunnel

services:
  finance-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: finance-tunnel
    restart: unless-stopped
    # Host networking so it can reach the app on 127.0.0.1:8095, where it listens.
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      # CHANGE ME. Zero Trust -> Networks -> Tunnels -> your "finance" tunnel.
      - TUNNEL_TOKEN=CHANGE_ME
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    x-casaos:
      envs:
        - container: TUNNEL_TOKEN
          description:
            en_us: Token of the finance Cloudflare Tunnel. Route finance.<domain> to HTTP localhost:8095.

x-casaos:
  architectures:
    - amd64
    - arm64
