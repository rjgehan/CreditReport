spring.application.name=finance

# --- Sign-in -------------------------------------------------------------------
# One person uses this app, so there is one account and it lives in the
# environment rather than the database. APP_PASSWORD may be plain text or a
# bcrypt hash written as {bcrypt}$2a$... Left empty, a random password is
# generated at startup and printed to the log once.
app.username=${APP_USERNAME:me}
app.password=${APP_PASSWORD:}

# How long "keep me signed in" lasts. The app is reached over Tailscale, which
# is the real gate, so signing in once a year per device is enough.
app.remember-me-days=${REMEMBER_ME_DAYS:365}

# Header carrying the visitor's real address, for login throttling. Leave unset
# on a tailnet; set CF-Connecting-IP only if this ever goes behind Cloudflare.
app.client-ip-header=${CLIENT_IP_HEADER:}

# --- Storage -------------------------------------------------------------------
# finance.db and, if APP_ENCRYPTION_KEY is unset, secret.key live here. The
# container sets this to /data.
app.data-dir=${APP_DATA_DIR:./data}

# AES-256 key (base64, 32 bytes) that encrypts the bank access tokens at rest.
# Generate with: openssl rand -base64 32
# Unset, a key is generated into the data directory on first start.
app.encryption-key=${APP_ENCRYPTION_KEY:}

# Seeds six months of realistic made-up accounts when the database is empty.
app.demo-data=${APP_DEMO_DATA:false}

# Whose calendar decides what "this month" means.
app.zone=${TZ:America/New_York}

# Plain http over Tailscale by default. Set SESSION_COOKIE_SECURE=true if you put
# HTTPS in front (tailscale serve, a reverse proxy).
app.secure-cookies=${SESSION_COOKIE_SECURE:false}

# When connected banks are pulled. Banks post once or twice a day, so a few
# pulls a day keeps things current without hammering anyone.
app.sync-cron=${SYNC_CRON:0 15 6,13,21 * * *}

# --- Banks ----------------------------------------------------------------------
# Bank and card syncing goes through SimpleFIN Bridge (about $15 a year), and
# needs no server configuration: paste a Setup Token on the Accounts page.

# --- Database ------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:${app.data-dir}/finance.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite has one writer. A single pooled connection turns concurrent writes into
# a queue in the app instead of SQLITE_BUSY errors from the driver.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Web -----------------------------------------------------------------------
server.forward-headers-strategy=framework
server.servlet.session.timeout=12h
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=${LOG_LEVEL:INFO}
logging.level.cloud.gehan=${APP_LOG_LEVEL:INFO}
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
